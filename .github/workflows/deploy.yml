name: IT CRM - Production CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: it-crm-production-deployment
  cancel-in-progress: false

jobs:
  build:
    name: Build and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/it_crm_ci
        run: npm ci

      - name: Validate Prisma schema
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/it_crm_ci
        run: npx prisma validate

      - name: Generate Prisma Client
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/it_crm_ci
        run: npx prisma generate

      - name: Check backend JavaScript syntax
        working-directory: backend
        run: node --check server.js

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --include=dev

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    needs: build

    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/it_crm_deploy
          chmod 600 ~/.ssh/it_crm_deploy

          ssh-keyscan -p "$VPS_PORT" -t ed25519 "$VPS_HOST" \
            > ~/.ssh/it_crm_known_hosts 2>/dev/null

          ACTUAL_FINGERPRINT=$(ssh-keygen -lf ~/.ssh/it_crm_known_hosts | awk '{print $2}')

          if [ "$ACTUAL_FINGERPRINT" != "$VPS_HOST_FINGERPRINT" ]; then
            echo "VPS SSH host fingerprint verification failed."
            exit 1
          fi

      - name: Deploy IT CRM
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -i ~/.ssh/it_crm_deploy \
            -p "$VPS_PORT" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile=$HOME/.ssh/it_crm_known_hosts \
            "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
              set -Eeuo pipefail

              APP_DIR="/var/www/IT_CRM"

              echo "===== DEPLOYING IT CRM ====="

              cd "$APP_DIR"

              git fetch origin main
              git checkout main
              git reset --hard origin/main

              echo "===== INSTALL BACKEND ====="
              cd "$APP_DIR/backend"
              npm ci

              echo "===== VALIDATE AND GENERATE PRISMA CLIENT ====="
              npx prisma validate
              npx prisma generate

              echo "===== INSTALL FRONTEND ====="
              cd "$APP_DIR/frontend"
              npm ci --include=dev

              echo "===== BUILD FRONTEND ====="
              npm run build

              echo "===== RESTART IT CRM BACKEND ====="
              pm2 restart it-crm-backend --update-env

              echo "===== RESTART IT CRM FRONTEND ====="
              pm2 restart it-crm-frontend --update-env

              echo "===== VERIFY BACKEND HEALTH ====="
              for i in $(seq 1 15); do
                if curl -fsS http://127.0.0.1:5002/api/health >/dev/null; then
                  echo "Backend health check passed."
                  break
                fi
                if [ "$i" -eq 15 ]; then
                  echo "Backend health check failed."
                  exit 1
                fi
                sleep 2
              done

              echo "===== VERIFY FRONTEND ====="
              curl -fsS http://127.0.0.1:4176/ >/dev/null

              echo "===== DEPLOYMENT COMPLETED ====="
              pm2 status it-crm-backend
              pm2 status it-crm-frontend
          REMOTE

      - name: Verify public production endpoints
        run: |
          curl --retry 5 --retry-delay 3 --retry-connrefused \
            -fsS https://oneassist.net.in/itcrm/ >/dev/null

          curl --retry 5 --retry-delay 3 --retry-connrefused \
            -fsS https://oneassist.net.in/itcrmapi/api/health

          echo "Public production health checks passed."
